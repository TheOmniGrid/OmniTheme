name: Bug report
description: Report reproducible OmniTheme behavior that does not match expectations.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve OmniTheme. Do not include private files, credentials, personal data, or sensitive paths.
  - type: input
    id: version
    attributes:
      label: OmniTheme version
      placeholder: Current version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Discord client, Vencord version, and theme variant
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed personal information, credentials, private links, and sensitive paths.
          required: true
        - label: This is not a security vulnerability; security issues will be reported privately.
          required: true
